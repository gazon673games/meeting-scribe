[tool.ruff]
target-version = "py310"
line-length = 80
src = ["backend/src"]
include = [
  "backend/**/*.py",
  "tools/**/*.py",
  "tests/**/*.py",
  "tools/**/*.spec",
]
extension = { spec = "python" }
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4", "RET", "UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.ruff.lint.per-file-ignores]
# PyInstaller provides SPECPATH, Analysis, PYZ, EXE, and COLLECT.
"tools/release/*.spec" = ["F821"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
